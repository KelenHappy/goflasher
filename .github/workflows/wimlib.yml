name: Bundled wimlib

on:
  pull_request:
    paths:
      - 'packaging/wimlib/**'
      - 'internal/wim/**'
      - 'cmd/wim-smoke/**'
      - 'packaging/legal/links-wimlib.sh'
      - '.github/actions/setup-winlibs/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/wimlib.yml'

  workflow_dispatch:

concurrency:
  group: wimlib-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundled-wimlib:
    name: Bundled wimlib (${{ matrix.os }}-${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64

          - runner: macos-15-intel
            os: macos
            arch: amd64

          - runner: macos-15
            os: macos
            arch: arm64

          - runner: windows-latest
            os: windows
            arch: amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 make pkg-config

      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select \
            -s /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          clang --version

      - name: Install pinned Windows toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-winlibs

      - name: Fetch pinned wimlib source
        shell: bash
        run: |
          set -euo pipefail

          source_path=$(packaging/wimlib/fetch.sh "$RUNNER_TEMP")

          printf 'WIMLIB_SOURCE_PATH=%s\n' \
            "$source_path" >> "$GITHUB_ENV"

      - name: Build native artifact
        shell: bash
        run: |
          set -euo pipefail

          packaging/wimlib/build.sh \
            "$WIMLIB_SOURCE_PATH" \
            "$RUNNER_TEMP/wimlib-out"

      - name: Verify native artifact
        shell: bash
        run: |
          set -euo pipefail

          hash=$(
            awk '{print $1}' \
              "$RUNNER_TEMP/wimlib-out/SHA256SUMS"
          )

          packaging/wimlib/verify.sh \
            "$RUNNER_TEMP/wimlib-out" \
            '${{ matrix.os }}' \
            '${{ matrix.arch }}' \
            "$hash" \
            "$RUNNER_TEMP/wimlib-out/smoke.wim"

      # Kept so a hash that differs from docs/legal/wimlib-1.14.5 can be
      # compared with a local build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwim-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/wimlib-out/lib/libwim.a
            ${{ runner.temp }}/wimlib-out/SHA256SUMS
          if-no-files-found: error
