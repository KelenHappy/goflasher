name: Bundled wimlib

on:
  pull_request:
    paths:
      - 'packaging/wimlib/**'
      - 'internal/wim/**'
      - 'cmd/wim-smoke/**'
      - 'packaging/legal/links-wimlib.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/wimlib.yml'

  workflow_dispatch:

concurrency:
  group: wimlib-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundled-wimlib:
    name: Bundled wimlib (${{ matrix.os }}-${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64

          - runner: macos-15-intel
            os: macos
            arch: amd64

          - runner: macos-15
            os: macos
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 make pkg-config

      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select \
            -s /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          clang --version

      - name: Fetch pinned wimlib source
        shell: bash
        run: |
          set -euo pipefail

          source_path=$(packaging/wimlib/fetch.sh "$RUNNER_TEMP")

          printf 'WIMLIB_SOURCE_PATH=%s\n' \
            "$source_path" >> "$GITHUB_ENV"

      - name: Build native artifact
        shell: bash
        run: |
          set -euo pipefail

          packaging/wimlib/build.sh \
            "$WIMLIB_SOURCE_PATH" \
            "$RUNNER_TEMP/wimlib-out"

      - name: Verify native artifact
        shell: bash
        run: |
          set -euo pipefail

          hash=$(
            awk '{print $1}' \
              "$RUNNER_TEMP/wimlib-out/SHA256SUMS"
          )

          packaging/wimlib/verify.sh \
            "$RUNNER_TEMP/wimlib-out" \
            '${{ matrix.os }}' \
            '${{ matrix.arch }}' \
            "$hash" \
            "$RUNNER_TEMP/wimlib-out/smoke.wim"
