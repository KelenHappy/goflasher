name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-native-phase1:
    name: macOS native framework Phase 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download purego binding dependency
        run: go mod download github.com/ebitengine/purego
      - name: Verify native architecture
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Test CoreFoundation, Disk Arbitration, IOKit, and callback ABI
        run: go test -v ./internal/disk/darwin/native -run '^TestPhase1'
      - name: Build Darwin native adapter
        run: go test -v ./internal/disk/darwin

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Darwin-only binding dependency
        if: runner.os == 'macOS'
        run: go mod download github.com/ebitengine/purego
      - name: Test built-in XZ streaming
        run: go test ./internal/image -run XZ
      - name: Test native disk manager
        run: go test ./internal/disk
      - run: go test ./...
      # Compile and exercise the GUI code without rebuilding Fyne's native
      # OpenGL driver on every pull request. Native release builds and the
      # documented local build commands still use the production `fyne` tag.
      - name: Test GUI source set
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: go test -tags "fyne ci" ./cmd/usbwriter

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - name: Reject external XZ runtime regressions
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*xz' internal || true)"
          test -z "$(rg '^Depends:.*xz-utils|^Requires: xz$' packaging || true)"
      - name: Reject udisksctl CLI regressions
        run: test -z "$(rg 'exec\.Command(Context)?\([^)]*udisksctl|Output\([^)]*udisksctl' internal || true)"
      - name: Reject udevadm CLI regressions
        run: test -z "$(rg 'exec\.Command(Context)?\([^)]*udevadm|Output\([^)]*udevadm' internal || true)"
      - name: Reject macOS command fallbacks
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*(diskutil|plutil|osascript)' internal cmd/usbwriter || true)"
      - run: go vet ./...
      - name: Scan Go dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: go test -race ./...

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev rpm zstd
      - name: Build Linux binary and packages
        run: |
          mkdir -p dist
          go build -trimpath -tags fyne -ldflags "-s -w" -o dist/goflasher ./cmd/usbwriter
          packaging/make-deb.sh dist/goflasher 0.0.0-ci_build dist
          packaging/make-rpm.sh dist/goflasher 0.0.0-ci dist
          packaging/make-arch.sh dist/goflasher 0.0.0-ci dist
          test -f dist/goflasher_0.0.0-ci.build_amd64.deb
          rpm_path=$(find dist -maxdepth 1 -name 'goflasher-0.0.0_ci-1*.rpm' -print -quit)
          test -n "$rpm_path"
          dpkg-deb --contents dist/goflasher_0.0.0-ci.build_amd64.deb | grep -F THIRD_PARTY_NOTICES.md
          dpkg-deb --contents dist/goflasher_0.0.0-ci.build_amd64.deb | grep -F github.com_ulikunitz_xz_LICENSE
          rpm -qlp "$rpm_path" | grep -F THIRD_PARTY_NOTICES.md
          rpm -qlp "$rpm_path" | grep -F github.com_ulikunitz_xz_LICENSE
          arch_path=dist/goflasher-0.0.0_ci-1-x86_64.pkg.tar.zst
          test -f "$arch_path"
          tar --zstd -tf "$arch_path" | grep -F ./usr/share/doc/goflasher/THIRD_PARTY_NOTICES.md
          tar --zstd -tf "$arch_path" | grep -F ./usr/share/doc/goflasher/third-party/github.com_ulikunitz_xz_LICENSE
          tar --zstd -xOf "$arch_path" ./.PKGINFO | grep -F 'depend = polkit'

  package-windows:
    name: Validate Windows portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build executable with production UAC manifest
        shell: bash
        run: |
          set -euo pipefail
          windres=$(command -v windres || find /c/mingw64 /c/msys64/mingw64 -name windres.exe -print -quit 2>/dev/null)
          test -n "$windres"
          "$windres" --target=pe-x86-64 -I packaging/windows packaging/windows/goflasher.rc -O coff -o cmd/usbwriter/goflasher_windows_amd64.syso
          mkdir -p dist
          go build -trimpath -tags fyne -ldflags "-s -w" -o dist/GoFlasher.exe ./cmd/usbwriter
          rm cmd/usbwriter/goflasher_windows_amd64.syso
          mt=$(find '/c/Program Files (x86)/Windows Kits/10/bin' -path '*/x64/mt.exe' -print 2>/dev/null | sort -V | tail -1)
          test -n "$mt"
          exe_win=$(cygpath -w "$PWD/dist/GoFlasher.exe")
          manifest_win=$(cygpath -w "$PWD/dist/embedded.manifest")
          MSYS2_ARG_CONV_EXCL='*' "$mt" -nologo "-inputresource:${exe_win};#1" "-out:${manifest_win}"
          grep -F requireAdministrator dist/embedded.manifest
          rm dist/embedded.manifest
      - name: Package and validate portable layout
        shell: bash
        run: |
          go run ./packaging/windows --executable dist/GoFlasher.exe --version 0.0.0-ci --output dist
          root=dist/GoFlasher-0.0.0-ci-windows-amd64
          test -f "$root/GoFlasher.exe"
          test -f "$root/README-Windows.txt"
          test -f "$root/THIRD_PARTY_NOTICES.md"
          test -f "$root/THIRD_PARTY_NOTICES.zh-TW.md"
          test -n "$(find "$root/licenses" -type f -print -quit)"
          (cd dist && sha256sum --check GoFlasher-0.0.0-ci-windows-amd64.zip.sha256)
