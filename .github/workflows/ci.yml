name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-latest
            os: windows
          - runner: macos-15
            os: macos

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      # Exercise the GUI source set without requiring the native Fyne/OpenGL
      # release build on every pull request.
      - name: Test GUI source set
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: go test -tags "fyne ci" ./cmd/usbwriter

  quality:
    name: Quality
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Reject external XZ runtime regressions
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*xz' internal || true)"
          test -z "$(rg '^Depends:.*xz-utils|^Requires: xz$' packaging || true)"

      - name: Reject udisksctl CLI regressions
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*udisksctl|Output\([^)]*udisksctl' internal || true)"

      - name: Reject udevadm CLI regressions
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*udevadm|Output\([^)]*udevadm' internal || true)"

      - name: Reject macOS command fallbacks
        run: |
          test -z "$(rg 'exec\.Command(Context)?\([^)]*(diskutil|plutil|osascript)' internal cmd/usbwriter || true)"

      - name: Race detector
        run: go test -race ./...
