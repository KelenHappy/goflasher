name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version used in package names
        required: true
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  windows:
    name: Windows amd64 portable ZIP
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows source set
        run: go test ./...
      - name: Embed UAC manifest and build portable executable
        shell: bash
        run: |
          set -euo pipefail
          windres=$(command -v windres || find /c/mingw64 /c/msys64/mingw64 -name windres.exe -print -quit 2>/dev/null)
          test -n "$windres"
          "$windres" --target=pe-x86-64 -I packaging/windows packaging/windows/goflasher.rc -O coff -o cmd/usbwriter/goflasher_windows_amd64.syso
          mkdir -p dist
          go build -trimpath -tags fyne -ldflags "-s -w" -o dist/GoFlasher.exe ./cmd/usbwriter
          rm cmd/usbwriter/goflasher_windows_amd64.syso
          mt=$(find '/c/Program Files (x86)/Windows Kits/10/bin' -path '*/x64/mt.exe' -print 2>/dev/null | sort -V | tail -1)
          test -n "$mt"
          exe_win=$(cygpath -w "$PWD/dist/GoFlasher.exe")
          manifest_win=$(cygpath -w "$PWD/dist/embedded.manifest")
          MSYS2_ARG_CONV_EXCL='*' "$mt" -nologo "-inputresource:${exe_win};#1" "-out:${manifest_win}"
          grep -F requireAdministrator dist/embedded.manifest
          rm dist/embedded.manifest
      - name: Authenticode sign and verify executable
        if: vars.WINDOWS_PRODUCTION_READY == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WINDOWS_CERTIFICATE_PFX_BASE64"
          test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          pfx="$RUNNER_TEMP/goflasher-signing.pfx"
          trap 'rm -f "$pfx"' EXIT
          printf '%s' "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode >"$pfx"
          signtool=$(find '/c/Program Files (x86)/Windows Kits/10/bin' -path '*/x64/signtool.exe' -print 2>/dev/null | sort -V | tail -1)
          test -n "$signtool"
          pfx_win=$(cygpath -w "$pfx")
          exe_win=$(cygpath -w "$PWD/dist/GoFlasher.exe")
          MSYS2_ARG_CONV_EXCL='*' "$signtool" sign /f "$pfx_win" /p "$WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 "$exe_win"
          MSYS2_ARG_CONV_EXCL='*' "$signtool" verify /pa /all /v "$exe_win"
      - name: Build portable ZIP and checksum
        shell: bash
        run: go run ./packaging/windows --executable dist/GoFlasher.exe --version "$VERSION" --output dist
      - name: Verify portable contents and secret exclusion
        shell: bash
        run: |
          set -euo pipefail
          root="dist/GoFlasher-$VERSION-windows-amd64"
          test -f "$root/GoFlasher.exe"
          test -f "$root/README-Windows.txt"
          test -f "$root/THIRD_PARTY_NOTICES.md"
          test -f "$root/THIRD_PARTY_NOTICES.zh-TW.md"
          test -n "$(find "$root/licenses" -type f -print -quit)"
          test -z "$(find "$root" -type f \( -name '*.pfx' -o -name '*.p12' -o -name '*.cer' -o -name '*.crt' -o -name '*.key' -o -name '*.pdb' \) -print -quit)"
          unzip -t "dist/GoFlasher-$VERSION-windows-amd64.zip"
          unzip -Z1 "dist/GoFlasher-$VERSION-windows-amd64.zip" | grep -Fx "GoFlasher-$VERSION-windows-amd64/GoFlasher.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goflasher-windows-amd64-${{ env.VERSION }}
          path: |
            dist/GoFlasher-${{ env.VERSION }}-windows-amd64.zip
            dist/GoFlasher-${{ env.VERSION }}-windows-amd64.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev rpm zstd
      - name: Test and build
        run: |
          go test ./...
          mkdir -p dist
          go build -trimpath -tags fyne -ldflags "-s -w" -o dist/goflasher ./cmd/usbwriter
          go build -trimpath -o dist/goflasher-helper ./cmd/goflasher-helper
      - name: Build Debian package
        run: packaging/make-deb.sh dist/goflasher "$VERSION" dist
      - name: Build RPM package
        run: packaging/make-rpm.sh dist/goflasher "$VERSION" dist
      - name: Build Arch Linux package
        run: packaging/make-arch.sh dist/goflasher "$VERSION" dist
      - name: Verify Debian and Arch Linux contents
        # The release-compliance record gate is a stable-release requirement
        # (docs/legal/RELEASE-COMPLIANCE.md). Enforce it only once the reviewed
        # record path is configured so alpha/dev builds still package and upload.
        env:
          GOFLASHER_RELEASE_GATE: ${{ vars.RELEASE_COMPLIANCE_RECORD_PATH != '' && '1' || '0' }}
          RELEASE_COMPLIANCE_RECORD: ${{ vars.RELEASE_COMPLIANCE_RECORD_PATH }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          deb=$(realpath "$(find dist -maxdepth 1 -name '*.deb' -print -quit)")
          dpkg-deb -x "$deb" "$work/deb"
          test -x "$work/deb/usr/bin/goflasher"
          test -x "$work/deb/usr/libexec/goflasher-helper"
          test -f "$work/deb/usr/share/polkit-1/actions/org.goflasher.usbwriter.policy"
          packaging/legal/verify-release.sh "$work/deb"

          arch=$(realpath "$(find dist -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)")
          mkdir "$work/arch"
          tar --zstd -xf "$arch" -C "$work/arch"
          test -x "$work/arch/usr/bin/goflasher"
          test -x "$work/arch/usr/libexec/goflasher-helper"
          test -f "$work/arch/usr/share/polkit-1/actions/org.goflasher.usbwriter.policy"
          packaging/legal/verify-release.sh "$work/arch"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          rm goflasher goflasher-helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goflasher-linux-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} DMG
    # Keep this job unconditional so development and alpha builds still test,
    # build, package, checksum, and upload their unsigned DMGs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native architecture and tests
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          go test ./...
      - name: Import Developer ID certificate
        if: vars.MACOS_PRODUCTION_READY == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/goflasher-certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$certificate" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Build app and helper
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -tags fyne -ldflags "-s -w" -o dist/GoFlasher ./cmd/usbwriter
          go build -trimpath -ldflags "-s -w" -o dist/goflasher-helper ./cmd/goflasher-helper
      - name: Package DMG
        env:
          SIGN_IDENTITY: ${{ vars.MACOS_PRODUCTION_READY == 'true' && secrets.MACOS_DEVELOPER_ID_APPLICATION || '' }}
          LIBWIM_DYLIB: ${{ vars.MACOS_WINDOWS_BUILDER_READY == 'true' && vars.MACOS_LIBWIM_DYLIB_PATH || '' }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${{ vars.MACOS_PRODUCTION_READY }}" == "true" ]]; then
            test -n "$SIGN_IDENTITY"
          fi
          packaging/macos/make-dmg.sh dist/GoFlasher dist/goflasher-helper "$VERSION" "${{ matrix.arch }}" "$SIGN_IDENTITY" dist
      - name: Verify DMG contents
        # Same stable-release compliance gate as the Linux verification step.
        env:
          GOFLASHER_RELEASE_GATE: ${{ vars.RELEASE_COMPLIANCE_RECORD_PATH != '' && '1' || '0' }}
          RELEASE_COMPLIANCE_RECORD: ${{ vars.RELEASE_COMPLIANCE_RECORD_PATH }}
        run: |
          set -euo pipefail
          dmg="dist/GoFlasher-${VERSION}-${{ matrix.arch }}.dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | sed 's|^.*\t||')
          trap 'hdiutil detach "$mount"' EXIT
          test -x "$mount/GoFlasher.app/Contents/MacOS/GoFlasher"
          test -x "$mount/GoFlasher.app/Contents/Library/HelperTools/org.goflasher.helper"
          packaging/legal/verify-release.sh "$mount/GoFlasher.app"
          if [[ "${{ vars.MACOS_WINDOWS_BUILDER_READY }}" == "true" ]]; then
            test -x "$mount/GoFlasher.app/Contents/Frameworks/libwim.15.dylib"
          fi
          plutil -lint "$mount/GoFlasher.app/Contents/Info.plist"
      - name: Generate checksum
        run: shasum -a 256 "dist/GoFlasher-${VERSION}-${{ matrix.arch }}.dmg" > "dist/GoFlasher-${VERSION}-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goflasher-macos-${{ matrix.arch }}-${{ env.VERSION }}
          path: |
            dist/GoFlasher-${{ env.VERSION }}-${{ matrix.arch }}.dmg
            dist/GoFlasher-${{ env.VERSION }}-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download reviewed build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: goflasher-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes
          gh release upload "$VERSION" dist/* --clobber
