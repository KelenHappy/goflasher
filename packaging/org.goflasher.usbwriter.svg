<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 128 128"
     role="img"
     aria-labelledby="title desc">

  <title id="title">GoFlasher Logo</title>
  <desc id="desc">
    Minimal USB flash drive logo with a lightning bolt
    and Go-style speed lines.
  </desc>

  <defs>
    <linearGradient id="usbBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Go-style speed lines -->
  <path
    d="M10 46 H34"
    fill="none"
    stroke="#16324A"
    stroke-width="6"
    stroke-linecap="round"
  />

  <path
    d="M6 60 H28"
    fill="none"
    stroke="#16324A"
    stroke-width="6"
    stroke-linecap="round"
  />

  <path
    d="M12 74 H32"
    fill="none"
    stroke="#16324A"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- USB connector -->
  <rect
    x="44"
    y="10"
    width="40"
    height="28"
    rx="5"
    fill="#E5E7EB"
    stroke="#16324A"
    stroke-width="5"
  />

  <rect
    x="52"
    y="17"
    width="6"
    height="10"
    rx="1.5"
    fill="#16324A"
  />

  <rect
    x="70"
    y="17"
    width="6"
    height="10"
    rx="1.5"
    fill="#16324A"
  />

  <!-- USB body -->
  <rect
    x="30"
    y="34"
    width="68"
    height="82"
    rx="18"
    fill="url(#usbBody)"
    stroke="#16324A"
    stroke-width="6"
  />

  <!-- Lightning bolt -->
  <path
    d="
      M67 48
      L48 72
      H60
      L54 97
      L82 66
      H69
      Z
    "
    fill="#FACC15"
    stroke="#16324A"
    stroke-width="4"
    stroke-linejoin="round"
  />

</svg>
